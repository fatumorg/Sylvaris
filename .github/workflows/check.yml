name: check

on:
  push:
  pull_request:

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L

  arch:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
      - run: pacman -Syu --noconfirm --needed base-devel namcap cmake qt6-base qt6-declarative qt6-wayland qt6-svg qt6-multimedia qt6-imageformats layer-shell-qt polkit-qt6 libpipewire pam wayland inter-font ttf-jetbrains-mono-nerd
      - run: |
          pkgver=$(sed -n 's/^pkgver=//p' dist/aur/sylvaris/PKGBUILD)
          test "v$pkgver" = "$GITHUB_REF_NAME"
          useradd -m builder
          mkdir -p /build/src
          cp dist/aur/sylvaris/PKGBUILD /build/
          cp -r "$GITHUB_WORKSPACE" "/build/src/Sylvaris-$pkgver"
          chown -R builder /build
          cd /build
          su builder -c 'makepkg -e --noconfirm'
          namcap PKGBUILD sylvaris-*.pkg.tar.zst
